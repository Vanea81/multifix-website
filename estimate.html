<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-lang="estimate_title">Bathroom Renovation Estimate</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="js/lang.js" defer></script>
</head>
<body>

<header>
  <nav>
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="estimate.html">Estimate</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<div class="container">

  <h1 data-lang="estimate_title">Bathroom Renovation Estimate</h1>

  <label data-lang="length_label">Length (m)</label>
  <input type="number" id="length" step="0.1">

  <label data-lang="width_label">Width (m)</label>
  <input type="number" id="width" step="0.1">

  <label data-lang="level_label">Level</label>
  <select id="level">
    <option value="800">Basic (800$/m²)</option>
    <option value="1200">Standard (1200$/m²)</option>
    <option value="1800">Premium (1800$/m²)</option>
  </select>

  <label>
    <input type="checkbox" id="bathtub">
    Replace bathtub (+1500$)
  </label>

  <label>
    <input type="checkbox" id="tiles">
    Replace tiles (+2000$)
  </label>

  <button onclick="calculate()">Calculate</button>

  <div id="result"></div>

  <p style="font-size:12px;margin-top:15px;">
    This estimate is for informational purposes only and does not constitute a binding quote.
  </p>

</div>

<script>
function calculate() {
  let l = parseFloat(document.getElementById('length').value);
  let w = parseFloat(document.getElementById('width').value);
  let lvl = parseFloat(document.getElementById('level').value);
  let b = document.getElementById('bathtub').checked;
  let t = document.getElementById('tiles').checked;

  if (!l || !w) {
    document.getElementById('result').innerText = 'Enter valid data';
    return;
  }

  let base = l * w * lvl;

  if (b) base += 1500;
  if (t) base += 2000;

  let min = Math.round(base * 0.85);
  let max = Math.round(base * 1.2);

  document.getElementById('result').innerText = `Estimated: ${min} - ${max} $`;
}
</script>

</body>
</html>
