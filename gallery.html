<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- SEO -->
  <title>Work Gallery | MultiFix Montreal</title>
  <meta name="description" content="See examples of MultiFix Montreal work: repairs, maintenance, installations and property upkeep in Montreal, Laval and the South Shore." />
  <link rel="canonical" href="https://multifixmontreal.ca/gallery.html" />
  <meta name="robots" content="index,follow" />

  <!-- Social -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="MultiFix" />
  <meta property="og:title" content="Work Gallery | MultiFix Montreal" />
  <meta property="og:description" content="Examples of repairs, maintenance and installations in Montreal, Laval and the South Shore." />
  <meta property="og:url" content="https://multifixmontreal.ca/gallery.html" />
  <meta name="twitter:card" content="summary" />

  <link rel="stylesheet" href="css/style.css"/>
</head>

<body>
  <header>
    <h1 data-i18n="title">MultiFix</h1>

    <div class="language-switch" aria-label="Language switch">
      <button type="button" onclick="setLanguage('en')">EN</button>
      <button type="button" onclick="setLanguage('fr')">FR</button>
      <button type="button" onclick="setLanguage('uk')">UA</button>
    </div>

    <div class="badge" data-i18n="home_badge">Montreal • Laval • South Shore</div>
  </header>

  <nav aria-label="Main navigation">
    <a href="index.html" data-i18n="nav_home">Home</a>
    <a href="owners.html" data-i18n="nav_owners">For Owners / Plex</a>
    <a href="services.html" data-i18n="nav_services">Services</a>
    <a href="gallery.html" data-i18n="nav_gallery">Gallery</a>
    <a href="contact.html" data-i18n="nav_contact">Contact</a>
    <a href="about.html" data-i18n="nav_about">About</a>
  </nav>

  <main id="main">
    <section class="section">
      <h2 data-i18n="gallery_title">Work Gallery</h2>
      <p class="small" data-i18n="gallery_note">Add 2–6 photos...</p>

      <div class="gallery">
        <img
          src="images/photo1.png"
          alt="Rental property maintenance work sample in Montreal"
          loading="lazy"
          decoding="async"
        />
        <img
          src="images/photo2.png"
          alt="Repair and installation work sample by MultiFix Montreal"
          loading="lazy"
          decoding="async"
        />
      </div>
    </section>
  </main>

  <footer>
    © 2025 <span data-i18n="title">MultiFix</span> — <span data-i18n="footer_text">Rental property maintenance in Montreal</span>
  </footer>

  <script src="js/lang.js" defer></script>
</body>
</html>
